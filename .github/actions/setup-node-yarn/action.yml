name: Set up project Node and Yarn
description: Use the repository's pinned Node and Yarn versions in CI
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Install and verify project Yarn
      shell: bash
      run: |
        set -euo pipefail
        version="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
        npm install --prefix "$RUNNER_TEMP/yarn" --ignore-scripts --no-audit --no-fund "yarn@$version"
        echo "$RUNNER_TEMP/yarn/node_modules/.bin" >> "$GITHUB_PATH"
        export PATH="$RUNNER_TEMP/yarn/node_modules/.bin:$PATH"
        test "$(yarn --version)" = "$version"
